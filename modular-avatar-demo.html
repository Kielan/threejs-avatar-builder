<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Three.js Avatar Builder</title>
<style>
  body {
    margin: 0;
    font-family: sans-serif;
    background: #f5f5f7;
    display: flex;
    height: 100vh;
  }

  #ui {
    width: 320px;
    background: white;
    border-right: 1px solid #ddd;
    display: flex;
    flex-direction: column;
  }

  .tabs {
    display: flex;
    justify-content: space-around;
    padding: 10px;
    border-bottom: 1px solid #eee;
  }

  .tab {
    cursor: pointer;
    font-weight: bold;
    opacity: 0.5;
  }

  .tab.active {
    opacity: 1;
  }

  .options {
    padding: 10px;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .option {
    height: 60px;
    background: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 10px;
  }

  #canvas {
    flex: 1;
  }
</style>
</head>
<body>

<div id="ui">
  <div class="tabs">
    <div class="tab active" data-tab="head">Head</div>
    <div class="tab" data-tab="face">Face</div>
    <div class="tab" data-tab="hair">Hair</div>
    <div class="tab" data-tab="outfit">Outfit</div>
  </div>
  <div class="options" id="options"></div>
</div>

<div id="canvas"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/OrbitControls.js';

// Scene
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0f0f0);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.5, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth - 320, window.innerHeight);
document.getElementById("canvas").appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Light
const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
scene.add(light);

// Avatar Group
const avatar = new THREE.Group();
scene.add(avatar);

// ---------- BASE BODY ----------
const materialSkin = new THREE.MeshStandardMaterial({ color: 0xffd1a4 });
const materialCloth = new THREE.MeshStandardMaterial({ color: 0x222222 });

let head, body, eyes, hair, jacket, pants, shoes, hat;

// BODY
function createBody(scale = 1) {
  if (body) avatar.remove(body);
  body = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.4 * scale, 1.2 * scale, 4, 8),
    materialCloth
  );
  body.position.y = 0.5;
  avatar.add(body);
}

// HEAD
function createHead(type = 0) {
  if (head) avatar.remove(head);

  let geo;
  if (type === 0) geo = new THREE.SphereGeometry(0.45, 32, 32);
  if (type === 1) geo = new THREE.BoxGeometry(0.7, 0.7, 0.7);
  if (type === 2) geo = new THREE.ConeGeometry(0.45, 0.8, 32);

  head = new THREE.Mesh(geo, materialSkin);
  head.position.y = 1.6;
  avatar.add(head);
}

// EYES
function createEyes(style = 0) {
  if (eyes) avatar.remove(eyes);

  const group = new THREE.Group();

  const eyeGeo = new THREE.SphereGeometry(0.08, 16, 16);
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

  const left = new THREE.Mesh(eyeGeo, eyeMat);
  const right = new THREE.Mesh(eyeGeo, eyeMat);

  left.position.set(-0.15, 1.6, 0.4);
  right.position.set(0.15, 1.6, 0.4);

  if (style === 1) {
    left.scale.y = 0.5;
    right.scale.y = 0.5;
  }

  group.add(left, right);
  eyes = group;
  avatar.add(eyes);
}

// HAIR
function createHair(style = 0) {
  if (hair) avatar.remove(hair);

  const mat = new THREE.MeshStandardMaterial({ color: 0xffa500 });

  if (style === 0) {
    hair = new THREE.Mesh(
      new THREE.SphereGeometry(0.5, 16, 16),
      mat
    );
  } else {
    hair = new THREE.Mesh(
      new THREE.ConeGeometry(0.5, 0.8, 16),
      mat
    );
  }

  hair.position.y = 1.9;
  avatar.add(hair);
}

// CLOTHES
function createJacket(on) {
  if (jacket) avatar.remove(jacket);
  if (!on) return;

  jacket = new THREE.Mesh(
    new THREE.BoxGeometry(0.9, 1.2, 0.5),
    new THREE.MeshStandardMaterial({ color: 0x111111 })
  );
  jacket.position.y = 0.6;
  avatar.add(jacket);
}

function createPants(color) {
  if (pants) avatar.remove(pants);

  pants = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 0.8, 0.4),
    new THREE.MeshStandardMaterial({ color })
  );
  pants.position.y = -0.2;
  avatar.add(pants);
}

function createShoes(color) {
  if (shoes) avatar.remove(shoes);

  const group = new THREE.Group();

  const geo = new THREE.BoxGeometry(0.25, 0.1, 0.4);
  const mat = new THREE.MeshStandardMaterial({ color });

  const left = new THREE.Mesh(geo, mat);
  const right = new THREE.Mesh(geo, mat);

  left.position.set(-0.15, -0.7, 0);
  right.position.set(0.15, -0.7, 0);

  group.add(left, right);
  shoes = group;
  avatar.add(shoes);
}

// INIT
createBody();
createHead();
createEyes();
createHair();
createJacket(true);
createPants(0x87ceeb);
createShoes(0xffffff);

// ---------- UI ----------
const optionsDiv = document.getElementById("options");

const config = {
  head: [
    () => createHead(0),
    () => createHead(1),
    () => createHead(2)
  ],
  face: [
    () => createEyes(0),
    () => createEyes(1)
  ],
  hair: [
    () => createHair(0),
    () => createHair(1)
  ],
  outfit: [
    () => createJacket(true),
    () => createJacket(false),
    () => createPants(0x87ceeb),
    () => createPants(0x333333),
    () => createShoes(0xffffff),
    () => createShoes(0xff0000)
  ]
};

function loadOptions(tab) {
  optionsDiv.innerHTML = "";
  config[tab].forEach(fn => {
    const div = document.createElement("div");
    div.className = "option";
    div.innerText = tab;
    div.onclick = fn;
    optionsDiv.appendChild(div);
  });
}

document.querySelectorAll(".tab").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    loadOptions(tab.dataset.tab);
  };
});

loadOptions("head");

// Render loop
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// Resize
window.addEventListener("resize", () => {
  camera.aspect = (window.innerWidth - 320) / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth - 320, window.innerHeight);
});
</script>
</body>
</html>

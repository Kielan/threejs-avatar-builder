<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Avatar Builder (JSON Animation System)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
body {
  margin: 0;
  display: flex;
  height: 100vh;
  font-family: sans-serif;
  background: #f5f5f7;
}
#ui {
  width: 340px;
  background: white;
  border-right: 1px solid #ddd;
  display: flex;
  flex-direction: column;
}
.tabs {
  display: flex;
  justify-content: space-around;
  padding: 12px;
}
.tab {
  cursor: pointer;
  opacity: 0.4;
}
.tab.active {
  opacity: 1;
  font-weight: bold;
}
.options {
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
#canvas { flex: 1; }
</style>
</head>

<body>

<div id="ui">
  <div class="tabs">
    <div class="tab active" data-tab="face">Face</div>
    <div class="tab" data-tab="clothes">Clothes</div>
  </div>
  <div class="options" id="options"></div>
</div>

<div id="canvas"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/OrbitControls.js';

// ---------- SCENE ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf0f0f0);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0,1.5,4);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth-340, window.innerHeight);
document.getElementById("canvas").appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,1,0);
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1));
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(2,4,2);
scene.add(light);

// ---------- SKELETON ----------
const skeletonJSON = {
  root: { pos:[0,0,0], parent:null },
  spine: { pos:[0,1,0], parent:"root" },
  head: { pos:[0,0.8,0], parent:"spine" },
  leftArm: { pos:[-0.6,0.6,0], parent:"spine" },
  rightArm:{ pos:[0.6,0.6,0], parent:"spine" },
  leftLeg: { pos:[-0.3,-1,0], parent:"root" },
  rightLeg:{ pos:[0.3,-1,0], parent:"root" }
};

const joints = {};
const avatar = new THREE.Group();
scene.add(avatar);

// create joints
Object.keys(skeletonJSON).forEach(name=>{
  joints[name] = new THREE.Object3D();
});

// hierarchy
Object.entries(skeletonJSON).forEach(([name,data])=>{
  const joint = joints[name];
  joint.position.fromArray(data.pos);

  if(data.parent){
    joints[data.parent].add(joint);
  } else {
    avatar.add(joint);
  }

  const cube = new THREE.Mesh(
    new THREE.BoxGeometry(0.1,0.1,0.1),
    new THREE.MeshStandardMaterial({ color:0x0077ff })
  );
  joint.add(cube);
});

// bones
const boneLines = [];
Object.entries(skeletonJSON).forEach(([name,data])=>{
  if(!data.parent) return;

  const line = new THREE.Line(
    new THREE.BufferGeometry(),
    new THREE.LineBasicMaterial({ color:0x000000 })
  );

  scene.add(line);

  boneLines.push({
    line,
    a: joints[name],
    b: joints[data.parent]
  });
});

// ---------- MODULES ----------
let hair, shirt;

function setHair(type){
  if(hair) joints.head.remove(hair);

  hair = new THREE.Mesh(
    type===0
      ? new THREE.SphereGeometry(0.25,16,16)
      : new THREE.ConeGeometry(0.25,0.5,16),
    new THREE.MeshStandardMaterial({ color:0xffaa00 })
  );

  hair.position.y = 0.3;
  joints.head.add(hair);
}

function setShirt(type){
  if(shirt) joints.spine.remove(shirt);

  shirt = new THREE.Mesh(
    new THREE.BoxGeometry(0.8,0.8,0.4),
    new THREE.MeshStandardMaterial({ color: type?0xff0000:0x333333 })
  );

  joints.spine.add(shirt);
}

setHair(0);
setShirt(0);

// ---------- FACE ----------
let smile = 0;
function updateFace(){
  joints.head.scale.y = 1 + smile * 0.3;
}

// ---------- ANIMATION SYSTEM ----------
const clips = {
  idle: {
    length: 2,
    tracks: {
      spine: [
        { time:0, rot:[0,0,0] },
        { time:1, rot:[0,0,0.2] },
        { time:2, rot:[0,0,0] }
      ],
      leftArm: [
        { time:0, rot:[0,0,0.5] },
        { time:1, rot:[0,0,-0.5] },
        { time:2, rot:[0,0,0.5] }
      ],
      rightArm: [
        { time:0, rot:[0,0,-0.5] },
        { time:1, rot:[0,0,0.5] },
        { time:2, rot:[0,0,-0.5] }
      ]
    }
  },

  walk: {
    length: 1,
    tracks: {
      leftLeg: [
        { time:0, rot:[0,0,0.8] },
        { time:0.5, rot:[0,0,-0.8] },
        { time:1, rot:[0,0,0.8] }
      ],
      rightLeg: [
        { time:0, rot:[0,0,-0.8] },
        { time:0.5, rot:[0,0,0.8] },
        { time:1, rot:[0,0,-0.8] }
      ]
    }
  }
};

let currentClip = clips.idle;
let time = 0;

function playClip(name){
  currentClip = clips[name];
  time = 0;
}

// interpolation
function lerp(a,b,t){ return a+(b-a)*t; }

function interp(track, t){
  for(let i=0;i<track.length-1;i++){
    const a = track[i];
    const b = track[i+1];

    if(t>=a.time && t<=b.time){
      const alpha = (t-a.time)/(b.time-a.time);
      return [
        lerp(a.rot[0], b.rot[0], alpha),
        lerp(a.rot[1], b.rot[1], alpha),
        lerp(a.rot[2], b.rot[2], alpha)
      ];
    }
  }
  return track[track.length-1].rot;
}

function applyAnimation(dt){
  time += dt;
  const t = time % currentClip.length;

  Object.entries(currentClip.tracks).forEach(([name,track])=>{
    const joint = joints[name];
    if(!joint) return;

    const rot = interp(track, t);
    joint.rotation.set(rot[0], rot[1], rot[2]);
  });
}

// ---------- UI ----------
const optionsDiv = document.getElementById("options");

function loadFaceUI(){
  optionsDiv.innerHTML="";

  const slider = document.createElement("input");
  slider.type="range";
  slider.min=0; slider.max=1; slider.step=0.01;

  slider.oninput = e=>{
    smile = e.target.value;
    updateFace();
  };

  const idleBtn = document.createElement("button");
  idleBtn.innerText = "Idle";
  idleBtn.onclick = ()=>playClip("idle");

  const walkBtn = document.createElement("button");
  walkBtn.innerText = "Walk";
  walkBtn.onclick = ()=>playClip("walk");

  optionsDiv.append(slider, idleBtn, walkBtn);
}

function loadClothesUI(){
  optionsDiv.innerHTML="";

  ["Hair 1","Hair 2","Shirt 1","Shirt 2"].forEach((label,i)=>{
    const btn = document.createElement("button");
    btn.innerText = label;
    btn.onclick = ()=>{
      if(i<2) setHair(i);
      else setShirt(i-2);
    };
    optionsDiv.appendChild(btn);
  });
}

document.querySelectorAll(".tab").forEach(tab=>{
  tab.onclick=()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");

    if(tab.dataset.tab==="clothes") loadClothesUI();
    else loadFaceUI();
  };
});

loadFaceUI();

// ---------- LOOP ----------
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);

  const dt = clock.getDelta();

  applyAnimation(dt);

  // update bone lines
  boneLines.forEach(b=>{
    const p1 = new THREE.Vector3();
    const p2 = new THREE.Vector3();

    b.a.getWorldPosition(p1);
    b.b.getWorldPosition(p2);

    b.line.geometry.setFromPoints([p1,p2]);
  });

  controls.update();
  renderer.render(scene,camera);
}
animate();

// ---------- RESIZE ----------
window.addEventListener("resize", ()=>{
  camera.aspect=(window.innerWidth-340)/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth-340,window.innerHeight);
});
</script>

</body>
</html>
